# Every push to main:
#  1. publishes the installable web app (iPhone + Android) to GitHub Pages
#  2. builds the Android app (FutureLedger.apk)
#  3. builds the Windows app (FutureLedger-Setup.exe) and the Mac app (FutureLedger-Mac.dmg)
#  4. attaches all three to the "Latest app" release
name: Build Future Ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Create the Android project
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build the app
        working-directory: android
        run: |
          # Same signing key every build, so a new version installs over the old one and keeps your numbers.
          mkdir -p ~/.android && cp ../signing/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../FutureLedger.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FutureLedger-android
          path: FutureLedger.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FutureLedger-${{ runner.os }}
          path: |
            desktop/dist/FutureLedger-Setup.exe
            desktop/dist/FutureLedger-Mac.dmg

  release:
    # Runs once the apps are built, so the files land in one release together.
    # If one platform fails, the others are still published.
    needs: [android, desktop]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Attach to the "Latest app" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Latest app
          body: |
            Download the file for your device:
            - Android phone: FutureLedger.apk
            - Windows PC: FutureLedger-Setup.exe
            - Mac: FutureLedger-Mac.dmg
          files: apps/*
          make_latest: true
